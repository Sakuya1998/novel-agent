name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: ruff check agents graph memory tools prompts models api config.py main.py tests
      - name: Test
        run: pytest
      - name: Evaluation regression gate
        run: python -m scripts.run_evaluations
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend test
        working-directory: frontend
        run: npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production smoke environment
        run: |
          cp .env.production.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Offline deployment checks
        run: python -m scripts.check_deployment
      - name: Build image
        run: docker build -t novel-agent:ci .
      - name: Build frontend image
        run: docker build -t novel-agent-frontend:ci frontend
      - name: Compose smoke test
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down --volumes' EXIT
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/readyz >/dev/null; then
              curl --fail --silent http://127.0.0.1:5173/healthz
              exit 0
            fi
            sleep 2
          done
          exit 1

  audit:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
