services:
  api:
    build:
      context: .
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
    volumes:
      - novel-memory:/app/memory
      - model-secrets:/app/data
      - novel-output:/app/output
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    expose:
      - "8000"

volumes:
  novel-memory:
  model-secrets:
  novel-output:
