name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run --locked ruff check src tests scripts main.py
      - name: Test
        run: uv run --locked pytest
      - name: Evaluation regression gate
        run: uv run --locked python -m scripts.run_evaluations
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend test
        working-directory: frontend
        run: npm test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deployment check dependencies
        run: pip install python-dotenv pydantic-settings pyyaml
      - name: Prepare production smoke environment
        run: |
          cp .env.production.example .env
          sed -i 's/^OPENAI_API_KEY=.*/OPENAI_API_KEY=test-readiness-key/' .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Offline deployment checks
        run: python -m scripts.check_deployment
      - name: Build image
        run: docker build -t novel-agent:ci .
      - name: Build frontend image
        run: docker build -t novel-agent-frontend:ci frontend
      - name: Compose smoke test
        run: |
          set -euo pipefail
          trap 'docker compose logs --no-color; docker compose down --volumes' EXIT
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/readyz >/dev/null; then
              curl --fail --silent http://127.0.0.1:5173/healthz
              exit 0
            fi
            sleep 2
          done
          exit 1

  audit:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Export locked production dependencies
        run: |
          mkdir -p .tmp
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .tmp/locked-requirements.txt
      - name: Dependency audit
        # ChromaDB 1.5.9 is the latest PyPI release, but these advisories have
        # no upstream fixed version yet. This project uses only embedded
        # persistent storage; check_deployment.py rejects HTTP-server usage
        # and Compose services, so keep this exception explicit and scoped.
        run: >
          uv tool run --from pip-audit pip-audit -r .tmp/locked-requirements.txt --strict
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln CVE-2026-45830
          --ignore-vuln CVE-2026-45831
          --ignore-vuln CVE-2026-45833
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high
