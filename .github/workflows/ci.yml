name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: ruff check agents graph memory tools prompts models api ui config.py main.py tests
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t novel-agent:ci .

  audit:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # 上游漏洞不阻断 CI,仅报告
