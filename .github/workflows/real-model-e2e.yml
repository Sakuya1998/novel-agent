name: Optional real-model compatibility smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Run bounded compatibility smoke
        id: smoke
        env:
          OPENAI_API_KEY: ${{ secrets.REAL_MODEL_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.REAL_MODEL_ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.REAL_MODEL_PROVIDER || 'openai' }}
          MODEL_NAME: ${{ vars.REAL_MODEL_CHAT_MODEL || 'gpt-4o-mini' }}
          EMBEDDING_MODEL: ${{ vars.REAL_MODEL_EMBEDDING_MODEL || 'text-embedding-3-small' }}
        run: |
          set +e
          uv run --locked python -m scripts.real_model_smoke --report real-model-smoke.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          exit 0
      - name: Upload redacted smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-smoke
          path: real-model-smoke.json
          if-no-files-found: error
          retention-days: 14
