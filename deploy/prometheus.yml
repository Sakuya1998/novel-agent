global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/novel-agent-alerts.yml

scrape_configs:
  # 将 api 替换为实际 API 服务名或反向代理地址。生产环境应通过
  # service discovery 或固定的内部 DNS 暴露 /metrics，不要将其发布到公网。
  - job_name: novel-agent
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["api:8000"]
