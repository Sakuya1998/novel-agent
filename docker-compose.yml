services:
  novel-agent:
    build: .
    image: novel-agent:latest
    container_name: novel-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NOVEL_AGENT_ENV: prod
      NOVEL_AGENT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
